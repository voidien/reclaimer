plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Output of the data generators (recipes, loot tables, tags, lang, models).
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('.cache/**')
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*') }
    }
    maven {
        name = 'Jared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup('mezz.jei')
            includeGroup('net.mezzdev.config')
        }
    }
    maven {
        name = 'SquidDev (CC: Tweaked)'
        url = 'https://maven.squiddev.cc'
        content { includeGroup('cc.tweaked') }
    }
    maven {
        // CurseForge-only required addons (Advanced Electricity, Advanced Computer Technic).
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup('curse.maven') }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // For in-game checks (tools/client-test/quick.sh): no need to edit this file, which then has to be restored.
            //   -PquickPlay=vrtest    join that world straight away
            //   -PclientSize=1280x720 window size
            //   -PhotSwap             debug port 5005, so changed classes can be pushed into the running game
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            if (project.hasProperty('clientSize')) {
                def size = project.property('clientSize').toString().split('x')
                programArguments.addAll '--width', size[0], '--height', size[1]
            }
            if (project.hasProperty('hotSwap')) {
                jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // An explicit heap: the default (a quarter of the machine's RAM) differs between CI runners and laptops.
            // ./gradlew runGameTestServer -PgametestHeap=1200m runs the suite in a small heap to catch memory growth.
            jvmArgument "-Xmx${project.findProperty('gametestHeap') ?: '6G'}"
            // Out of memory, a server thrashes for hours holding the world and the CPU: end it, and the run fails where it can be seen.
            jvmArgument '-XX:+ExitOnOutOfMemoryError'
            // No chunk is written and the run ends after its summary, for twice the speed. -PgametestChunkSaves runs real saves and a
            // real stop, as CI does on main (GameTestChunkSaveMixin).
            systemProperty 'void_reclaimer.gametestSkipChunkSaves', (!project.hasProperty('gametestChunkSaves')).toString()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runGameTestServer -PgametestFilter=ZeroGMining (class or test name, comma-separated)
            if (project.hasProperty('gametestFilter')) {
                systemProperty 'void_reclaimer.gametestFilter', project.property('gametestFilter')
            }
        }

        // Create Aeronautics / Sable tests, kept out of gameTestServer: ./gradlew runGameTestAeronautics
        gameTestAeronautics {
            type = 'gameTestServer'
            // Its own directory: Gradle runs tasks in parallel and the two GameTest worlds must not collide.
            gameDirectory = file('run-aero')
            jvmArgument "-Xmx${project.findProperty('gametestHeap') ?: '6G'}"
            // Out of memory, a server thrashes for hours holding the world and the CPU: end it, and the run fails where it can be seen.
            jvmArgument '-XX:+ExitOnOutOfMemoryError'
            systemProperty 'void_reclaimer.gametestSkipChunkSaves', (!project.hasProperty('gametestChunkSaves')).toString()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id + '_aero'
            // ./gradlew runGameTestAeronautics -PgametestFilter=theHoldsStop (same filter as runGameTestServer)
            if (project.hasProperty('gametestFilter')) {
                systemProperty 'void_reclaimer.gametestFilter', project.property('gametestFilter')
            }
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit tests run with the game's classes loaded (FML JUnit launcher).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Dev-only runtime mods (e.g. full JEI), not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Only used to find Create's jar for extractCreateLibs.
    createJar {
        canBeConsumed = false
        canBeResolved = true
    }
}

tasks.register('extractCreateLibs', Sync) {
    from({ configurations.createJar.files.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('create-libs')
}

dependencies {
    // GeckoLib: body, part and helper-drone models/animations (required).
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // JEI: compile against the API only; the full mod is present in dev runs.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // CC: Tweaked (optional, like JEI): compile against the API only; the full mod in dev runs and GameTests so peripherals
    // can be tested. All CC code is in compat/cc and is only touched when "computercraft" is loaded.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cctweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cctweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cctweaked_version}"
    localRuntime "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cctweaked_version}"

    // Create: required dependency. The Modrinth release jar bundles Flywheel, Ponder and Registrate as nested jars, which javac
    // can't see: extractCreateLibs unpacks them (the exact versions Create runs with) for compiling only.
    implementation "maven.modrinth:create:${create_version}"
    createJar "maven.modrinth:create:${create_version}"
    // Sable's API is compiled against for ship thrusters (it stays a runtime mod below); its Veil and companion jars are
    // nested the same way as Create's, so extractCreateLibs unpacks them too.
    compileOnly "maven.modrinth:sable:${sable_version}"
    createJar "maven.modrinth:sable:${sable_version}"
    // Aeronautics' nested jars too: "Simulated" holds the only disassembly and ship-to-ship block moves (the Station Core).
    createJar "maven.modrinth:create-aeronautics:${aeronautics_version}"
    compileOnly fileTree(layout.buildDirectory.dir('create-libs')) {
        builtBy 'extractCreateLibs'
        include '*.jar'
    }
    // Unit tests of pure ship maths use Sable's companion types (Pose3d, BoundingBox3i).
    testCompileOnly "maven.modrinth:sable:${sable_version}"
    testCompileOnly fileTree(layout.buildDirectory.dir('create-libs')) {
        builtBy 'extractCreateLibs'
        include '*.jar'
    }

    // Create Aeronautics (required) and its physics engine Sable. Runtime only: our code doesn't compile against them yet.
    localRuntime "maven.modrinth:sable:${sable_version}"
    localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
    // The unit-test runtime only sees implementation/testRuntimeOnly, and loading our mod needs its required mods.
    testRuntimeOnly "maven.modrinth:sable:${sable_version}"
    testRuntimeOnly "maven.modrinth:create-aeronautics:${aeronautics_version}"

    // Required Create addons (runtime only, like Aeronautics; compile-only where our code reaches into one).
    def requiredAddons = [
            "maven.modrinth:createaddition:${createaddition_version}",
            "maven.modrinth:create-propulsion-simulated:${propulsion_version}",
            "maven.modrinth:create-tfmg:${tfmg_version}",
            "curse.maven:create-advanced-electricity-addon-1743391:${advanced_electricity_file}",
            "curse.maven:create-advanced-computer-technic-1759784:${advanced_computer_file}",
    ]
    requiredAddons.each {
        localRuntime it
        testRuntimeOnly it
    }
    // The CogScript patch: docs/ADVANCED_COMPUTER_TECHNIC_PATCH.md.
    compileOnly "curse.maven:create-advanced-electricity-addon-1743391:${advanced_electricity_file}"
    compileOnly "maven.modrinth:createaddition:${createaddition_version}"

    // Performance mods we stay compatible with. Dev runs only, never published.
    localRuntime "maven.modrinth:sodium:${sodium_version}"
    localRuntime "maven.modrinth:modernfix:${modernfix_version}"
    localRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
    localRuntime "maven.modrinth:immediatelyfast:${immediatelyfast_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Unit tests boot the mod with its required mods (Create, Aeronautics, the required addons); Gradle's default 512 MB is too small.
    maxHeapSize = '2G'
}

// Pure logic in about 5 s instead of 20: the game boots for neither. `test` stays the full run, in `build` and on CI. A new test
// that fails here with NoClassDefFoundError needs the game: add it to this list.
tasks.register('fastTest', Test) {
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('junit-fml') } + fileTree(layout.buildDirectory.dir('create-libs')) { include '*.jar' }
    maxHeapSize = '1G'
    exclude '**/ConfigConditionTest.class', '**/ItemsMadeCriterionTest.class', '**/LinkStateTest.class',
            '**/RecipeDescriptionTest.class', '**/ReplicatorLogicTest.class'
}

// Expands ${...} properties in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            geckolib_version_range : geckolib_version_range,
            jei_version_range      : jei_version_range,
            cctweaked_version_range: cctweaked_version_range,
            create_version_range   : create_version_range,
            aeronautics_version_range: aeronautics_version_range,
            sable_version_range    : sable_version_range,
            createaddition_version_range: createaddition_version_range,
            propulsion_version_range: propulsion_version_range,
            tfmg_version_range     : tfmg_version_range,
            advanced_electricity_version_range: advanced_electricity_version_range,
            advanced_computer_version_range: advanced_computer_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
