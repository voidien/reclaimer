plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Output of the data generators (recipes, loot tables, tags, lang, models).
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('.cache/**')
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*') }
    }
    maven {
        name = 'Jared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup('mezz.jei')
            includeGroup('net.mezzdev.config')
        }
    }
    // SPIKE: CurseForge-only addons.
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup('curse.maven') }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'vrtest'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runGameTestServer -PgametestFilter=ZeroGMining (class or test name, comma-separated)
            if (project.hasProperty('gametestFilter')) {
                systemProperty 'void_reclaimer.gametestFilter', project.property('gametestFilter')
            }
        }

        // Create Aeronautics / Sable tests, kept out of gameTestServer: ./gradlew runGameTestAeronautics
        gameTestAeronautics {
            type = 'gameTestServer'
            // Its own directory: Gradle runs tasks in parallel and the two GameTest worlds must not collide.
            gameDirectory = file('run-aero')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id + '_aero'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit tests run with the game's classes loaded (FML JUnit launcher).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Dev-only runtime mods (e.g. full JEI), not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Only used to find Create's jar for extractCreateLibs.
    createJar {
        canBeConsumed = false
        canBeResolved = true
    }
}

tasks.register('extractCreateLibs', Sync) {
    from({ configurations.createJar.files.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('create-libs')
}

dependencies {
    // GeckoLib: body, part and helper-drone models/animations (required).
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // JEI: compile against the API only; the full mod is present in dev runs.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Create: required dependency. The Modrinth release jar bundles Flywheel, Ponder and Registrate as nested jars, which javac
    // can't see: extractCreateLibs unpacks them (the exact versions Create runs with) for compiling only.
    implementation "maven.modrinth:create:${create_version}"
    createJar "maven.modrinth:create:${create_version}"
    compileOnly fileTree(layout.buildDirectory.dir('create-libs')) {
        builtBy 'extractCreateLibs'
        include '*.jar'
    }

    // Create Aeronautics (required) and its physics engine Sable. Runtime only: our code doesn't compile against them yet.
    localRuntime "maven.modrinth:sable:${sable_version}"
    localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
    // The unit-test runtime only sees implementation/testRuntimeOnly, and loading our mod needs its required mods.
    testRuntimeOnly "maven.modrinth:sable:${sable_version}"
    testRuntimeOnly "maven.modrinth:create-aeronautics:${aeronautics_version}"

    // SPIKE (never merged): candidate Create addons, loaded only for the compatibility check. -PspikeMods=a,b,c picks a subset.
    def spike = [
        createaddition   : 'maven.modrinth:createaddition:neoforge-1.21.1-1.7.2',
        newage           : 'maven.modrinth:create-new-age:1.2.0+mc1.21.1',
        cctweaked        : 'maven.modrinth:cc-tweaked:1ewzHZYg',
        avionics         : 'maven.modrinth:create-avionics:0.7.0',
        propulsion       : 'maven.modrinth:create-propulsion-simulated:1.1.5',
        aeroworks        : 'maven.modrinth:create-aeroworks:1.5.0+mc1.21.1',
        steamnrails      : 'maven.modrinth:create-steam-n-rails-1.21.1:0.3.0-beta.2+neoforge-mc1.21.1',
        additionsaerocmp : 'maven.modrinth:create-crafts-additions-and-aeronautics-compat:1.0.0',
        additionssablecmp: 'maven.modrinth:create-additions-sable-compat:0.1.13',
        advelectricity   : 'curse.maven:create-advanced-electricity-addon-1743391:9362753',
        advcomputer      : 'curse.maven:create-advanced-computer-technic-1759784:9362807',
        tfmg             : 'maven.modrinth:create-tfmg:uDi14nbt',
        oreexc           : 'maven.modrinth:create-ore-excavation:tivxiPTo',
        powerloader      : 'maven.modrinth:create-power-loader:3Y4r0ItR',
        hypertube        : 'maven.modrinth:hypertube:qYjOyvgW',
        controllers      : 'maven.modrinth:create-tweaked-controllers:csCe2v7f',
        tradingfloor     : 'maven.modrinth:create-trading-floor:K3nIvcWT',
        numismatics      : 'maven.modrinth:numismatics:kVi3TESX',
        connected        : 'maven.modrinth:create-connected:Xe7EqzfQ',
        copycats         : 'maven.modrinth:copycats:bPYeUWZx',
        deco             : 'maven.modrinth:create-deco:qrcMVoBD',
        radars           : 'maven.modrinth:create-radars:q723aMHO',
        electro          : 'maven.modrinth:create-electro-energetics:ZMfRgLy5',
        powergrid        : 'maven.modrinth:power-grid:jCkPHjmP',
        architectury     : 'maven.modrinth:architectury-api:1IiqEQGl',
    ]
    def picked = (findProperty('spikeMods') ?: '').toString().split(',').findAll { it }
    picked.each { name ->
        localRuntime spike.get(name) ?: { throw new GradleException("unknown spike mod " + name) }()
        testRuntimeOnly spike.get(name)
    }

    // Performance mods we stay compatible with. Dev runs only, never published.
    localRuntime "maven.modrinth:sodium:${sodium_version}"
    localRuntime "maven.modrinth:modernfix:${modernfix_version}"
    localRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
    localRuntime "maven.modrinth:immediatelyfast:${immediatelyfast_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Expands ${...} properties in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            geckolib_version_range : geckolib_version_range,
            jei_version_range      : jei_version_range,
            create_version_range   : create_version_range,
            aeronautics_version_range: aeronautics_version_range,
            sable_version_range    : sable_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
