name: Build

on:
  # Pull requests merge on tools/verify.sh, run locally. This is the check after the merge, on a clean machine, with real saves.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'art/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Each merge to main gets its answer: a later one waits rather than cancelling it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and unit tests
        run: ./gradlew build --stacktrace

      - name: Tool tests (offline, fake Retro Diffusion server)
        run: |
          python3 tools/art/test_rd_generate.py
          python3 tools/art/test_rig_check.py
          python3 tools/art/test_anim_slice.py
          python3 tools/test_progress_fold.py

      - name: GameTests
        # A healthy run takes a few minutes. A hang is a new bug to read, so it fails the run after a thread dump.
        run: tools/timed.sh 900 moddev/gameTest ./gradlew runGameTestServer -PgametestHeap=10G -PgametestChunkSaves --stacktrace

      - name: Datagen output is up to date
        # RenderClassesFirstMixin ended the start-up deadlock between Create and Veil (see HANDOFF.md), so a hang here is a new bug to
        # read, not to try again. A healthy run takes under a minute: a hung one is cut off, after a thread dump of what it is stuck on.
        run: |
          ( sleep 285; ps -eo pid,args | awk '$2 ~ /\/bin\/java$/ && /moddev\/data/ {print $1}' | while read -r pid; do
              echo "::group::Thread dump of the hung runData"; jstack -l "$pid"; echo "::endgroup::"
            done ) &
          dump=$!
          status=0
          timeout 300 ./gradlew runData --stacktrace || status=$?
          # The dump may be over already, and the step runs with -e: a failed kill must not hide the result.
          kill "$dump" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "runData failed or hung"
            exit "$status"
          fi
          git diff --exit-code -- src/generated

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            run/logs/
          if-no-files-found: ignore

  restart:
    # Tests that span a restart, each on its own machine: in a row they took over four minutes, the longest job of a pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One failure must not cancel the others: they are separate tests, and a fix should see them all.
      fail-fast: false
      matrix:
        test:
          - aCrashKeepsOnlyWhatWasSaved
          - aLinkOutlivesACrash
          - aRelayListOutlivesARestart
          - aWokenShellOutlivesACrash
          - aShellsQueuedItemsOutliveACrash
          - anOldShellGoesAfterACrash
          - aNewerShellWinsAClash
          - anOldCopyIsRecovered
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: ${{ matrix.test }}
        run: tools/restart-test.sh main ${{ matrix.test }}

      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: restart-logs-${{ matrix.test }}
          path: run/logs/
          if-no-files-found: ignore

  aeronautics:
    # Create Aeronautics / Sable inside deep space. Its own job, so an upstream problem doesn't hide the main results.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Aeronautics GameTests
        run: tools/timed.sh 900 moddev/gameTest ./gradlew runGameTestAeronautics -PgametestHeap=10G -PgametestChunkSaves --stacktrace

      - name: A held ship survives a restart
        run: tools/restart-test.sh aero aHeldShipLoadsItself

      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aeronautics-logs
          path: run-aero/logs/
          if-no-files-found: ignore
