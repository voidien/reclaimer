## Dependencies (versions verified against their Maven repos on 2026-10-28)
# https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/
geckolib_version=4.9.3
geckolib_version_range=[4.9.3,)
# https://modrinth.com/mod/create (latest public 1.21.1 NeoForge release)
create_version=6.0.10+mc1.21.1
create_version_range=[6.0.10,6.1)
# https://modrinth.com/mod/create-aeronautics and https://modrinth.com/mod/sable (latest 1.21.1 NeoForge releases, checked 2026-10-29)
aeronautics_version=1.3.2+mc1.21.1
sable_version=2.0.6+mc1.21.1
aeronautics_version_range=[1.3.2,1.4)
sable_version_range=[2.0.6,2.1)
# Required Create addons (decided 2026-10-30 after the compatibility spike, see PROGRESS.md "Addon compatibility spike").
# Modrinth entries are pinned by version id where a version number could resolve to another loader's jar.
# https://modrinth.com/mod/createaddition
createaddition_version=neoforge-1.21.1-1.7.2
createaddition_version_range=[1.7.2,)
# https://modrinth.com/mod/create-propulsion-simulated
propulsion_version=1.1.5
propulsion_version_range=[1.1.5,)
# https://modrinth.com/mod/create-tfmg (version id uDi14nbt = 1.2.0)
tfmg_version=uDi14nbt
tfmg_version_range=[1.2.0,)
# CurseForge only, through cursemaven: Create: Advanced Electricity / Technology Addon (project 1743391) and
# Create: Advanced Computer Technic (project 1759784). Their jars report versions like "1.21.1_1.0.0".
advanced_electricity_file=9362753
advanced_electricity_version_range=[1.21.1_1.0.0,)
advanced_computer_file=9362807
advanced_computer_version_range=[1.21.1_1.0.0,)
# https://maven.blamejared.com/mezz/jei/
jei_version=19.70.0.464
jei_version_range=[19.0,)
# Dev-run compatibility testing only (https://modrinth.com, NeoForge 1.21.1 builds)
sodium_version=mc1.21.1-0.8.13-neoforge
modernfix_version=5.27.27+mc1.21.1
ferritecore_version=7.0.3-neoforge
immediatelyfast_version=1.6.15+1.21.1-neoforge
# Tests (https://junit.org)
junit_version=5.14.4

